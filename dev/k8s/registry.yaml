# A plain-HTTP OCI registry: push-commit.sh pushes the fleet to it from the host (127.0.0.1:<port>), and
# source-controller pulls it in the cluster (registry.registry.svc.cluster.local:5000, insecure: true).
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector: { matchLabels: { app: registry } }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          ports: [{ containerPort: 5000, name: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - { port: 5000, targetPort: http, nodePort: 30500 }
