# Plain Flux profile: the root source and Kustomization (what `flux bootstrap` would create).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: oci://registry.registry.svc.cluster.local:5000/fleet
  ref: { tag: latest }
  insecure: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/dev
  prune: true
  sourceRef: { kind: OCIRepository, name: flux-system }
