# kube-state-metrics custom-resource-state config for the Flux GitOps panel (plain Flux).
#
# Based on fluxcd/flux2-monitoring-example
#   monitoring/controllers/kube-prometheus-stack/kube-state-metrics-config.yaml
#   https://github.com/fluxcd/flux2-monitoring-example
# and extended for this panel:
#   - every kind gets `reason` (the Ready condition's reason, the same label the Flux Operator's
#     flux_resource_info carries), so a failed band in the history strip can say why;
#   - Kustomization gets `path`; HelmRelease and HelmChart get `source_name`, like Kustomization;
#   - `revision` and `source_name` stay on Kustomization as upstream has them.
# Only the seven kinds the panel reads are here; add the notification and image kinds from the upstream
# file if you want them in other dashboards.
#
# Use it with kube-state-metrics --custom-resource-state-config-file=<this file>, or paste the
# `spec:` block under kube-state-metrics.customResourceState.config in kube-prometheus-stack values
# (see the README). kube-state-metrics needs list and watch on these resources:
#
#   - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
#     resources: [gitrepositories, ocirepositories, buckets, helmrepositories, helmcharts,
#                 kustomizations, helmreleases]
#     verbs: [list, watch]
#
# KSM adds customresource_group, customresource_kind and customresource_version to every series
# (https://github.com/kubernetes/kube-state-metrics/blob/main/docs/metrics/extend/customresourcestate-metrics.md).
# Not needed with the Flux Operator: it exports flux_resource_info itself, which the panel prefers.
kind: CustomResourceStateMetrics
spec:
  resources:
    - groupVersionKind:
        group: kustomize.toolkit.fluxcd.io
        version: v1
        kind: Kustomization
      metricNamePrefix: gotk
      metrics:
        - name: resource_info
          help: 'The current state of a Flux Kustomization resource.'
          each:
            type: Info
            info:
              labelsFromPath:
                name: [metadata, name]
          labelsFromPath:
            exported_namespace: [metadata, namespace]
            ready: [status, conditions, '[type=Ready]', status]
            reason: [status, conditions, '[type=Ready]', reason]
            suspended: [spec, suspend]
            revision: [status, lastAppliedRevision]
            source_name: [spec, sourceRef, name]
            path: [spec, path]
    - groupVersionKind:
        group: helm.toolkit.fluxcd.io
        version: v2
        kind: HelmRelease
      metricNamePrefix: gotk
      metrics:
        - name: resource_info
          help: 'The current state of a Flux HelmRelease resource.'
          each:
            type: Info
            info:
              labelsFromPath:
                name: [metadata, name]
          labelsFromPath:
            exported_namespace: [metadata, namespace]
            ready: [status, conditions, '[type=Ready]', status]
            reason: [status, conditions, '[type=Ready]', reason]
            suspended: [spec, suspend]
            revision: [status, history, '0', chartVersion]
            chart_name: [status, history, '0', chartName]
            chart_app_version: [status, history, '0', appVersion]
            chart_ref_name: [spec, chartRef, name]
            chart_source_name: [spec, chart, spec, sourceRef, name]
            source_name: [spec, chart, spec, sourceRef, name]
    - groupVersionKind:
        group: source.toolkit.fluxcd.io
        version: v1
        kind: GitRepository
      metricNamePrefix: gotk
      metrics:
        - name: resource_info
          help: 'The current state of a Flux GitRepository resource.'
          each:
            type: Info
            info:
              labelsFromPath:
                name: [metadata, name]
          labelsFromPath:
            exported_namespace: [metadata, namespace]
            ready: [status, conditions, '[type=Ready]', status]
            reason: [status, conditions, '[type=Ready]', reason]
            suspended: [spec, suspend]
            revision: [status, artifact, revision]
            url: [spec, url]
    - groupVersionKind:
        group: source.toolkit.fluxcd.io
        version: v1
        kind: OCIRepository
      metricNamePrefix: gotk
      metrics:
        - name: resource_info
          help: 'The current state of a Flux OCIRepository resource.'
          each:
            type: Info
            info:
              labelsFromPath:
                name: [metadata, name]
          labelsFromPath:
            exported_namespace: [metadata, namespace]
            ready: [status, conditions, '[type=Ready]', status]
            reason: [status, conditions, '[type=Ready]', reason]
            suspended: [spec, suspend]
            revision: [status, artifact, revision]
            url: [spec, url]
    - groupVersionKind:
        group: source.toolkit.fluxcd.io
        version: v1
        kind: Bucket
      metricNamePrefix: gotk
      metrics:
        - name: resource_info
          help: 'The current state of a Flux Bucket resource.'
          each:
            type: Info
            info:
              labelsFromPath:
                name: [metadata, name]
          labelsFromPath:
            exported_namespace: [metadata, namespace]
            ready: [status, conditions, '[type=Ready]', status]
            reason: [status, conditions, '[type=Ready]', reason]
            suspended: [spec, suspend]
            revision: [status, artifact, revision]
            endpoint: [spec, endpoint]
            bucket_name: [spec, bucketName]
    - groupVersionKind:
        group: source.toolkit.fluxcd.io
        version: v1
        kind: HelmRepository
      metricNamePrefix: gotk
      metrics:
        - name: resource_info
          help: 'The current state of a Flux HelmRepository resource.'
          each:
            type: Info
            info:
              labelsFromPath:
                name: [metadata, name]
          labelsFromPath:
            exported_namespace: [metadata, namespace]
            ready: [status, conditions, '[type=Ready]', status]
            reason: [status, conditions, '[type=Ready]', reason]
            suspended: [spec, suspend]
            revision: [status, artifact, revision]
            url: [spec, url]
    - groupVersionKind:
        group: source.toolkit.fluxcd.io
        version: v1
        kind: HelmChart
      metricNamePrefix: gotk
      metrics:
        - name: resource_info
          help: 'The current state of a Flux HelmChart resource.'
          each:
            type: Info
            info:
              labelsFromPath:
                name: [metadata, name]
          labelsFromPath:
            exported_namespace: [metadata, namespace]
            ready: [status, conditions, '[type=Ready]', status]
            reason: [status, conditions, '[type=Ready]', reason]
            suspended: [spec, suspend]
            revision: [status, artifact, revision]
            chart_name: [spec, chart]
            chart_version: [spec, version]
            source_name: [spec, sourceRef, name]
