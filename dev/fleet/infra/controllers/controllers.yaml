# A Helm repository defined here and used by later stages (a source chain), and a controller installed
# from it with drift detection on: dev/up.sh scales it by hand so helm-controller corrects the drift.
apiVersion: v1
kind: Namespace
metadata:
  name: widget-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 30m
  url: https://stefanprodan.github.io/podinfo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: widget-controller
  namespace: widget-system
spec:
  interval: 1m
  chart:
    spec:
      chart: podinfo
      version: '6.7.1'
      sourceRef: { kind: HelmRepository, name: podinfo, namespace: flux-system }
  driftDetection:
    mode: enabled
  values:
    replicaCount: 1
    resources: { requests: { cpu: 5m, memory: 16Mi } }
