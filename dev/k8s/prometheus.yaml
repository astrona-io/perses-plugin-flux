# Prometheus and kube-state-metrics for the reconcile history strip.
#   - kube-state-metrics runs only the custom-resource-state collector, with deploy/kube-state-metrics-config.yaml
#     (up.sh puts it in the ConfigMap kube-state-metrics-config): gotk_resource_info.
#   - Prometheus scrapes it, the Flux controllers (gotk_reconcile_duration_seconds) and, in the operator
#     profile, the Flux Operator (flux_resource_info). Every series gets cluster="dev".
apiVersion: v1
kind: Namespace
metadata:
  name: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-kube-state-metrics
rules:
  - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, buckets, helmrepositories, helmcharts, kustomizations, helmreleases]
    verbs: [list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-kube-state-metrics
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dev-kube-state-metrics }
subjects: [{ kind: ServiceAccount, name: kube-state-metrics, namespace: prometheus }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: prometheus
spec:
  replicas: 1
  selector: { matchLabels: { app: kube-state-metrics } }
  template:
    metadata:
      labels: { app: kube-state-metrics }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --custom-resource-state-only=true
            - --custom-resource-state-config-file=/etc/ksm/config.yaml
          ports: [{ containerPort: 8080, name: http }]
          volumeMounts: [{ name: config, mountPath: /etc/ksm }]
      volumes: [{ name: config, configMap: { name: kube-state-metrics-config } }]
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: prometheus
spec:
  selector: { app: kube-state-metrics }
  ports: [{ port: 8080, targetPort: http }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-prometheus
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-prometheus
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dev-prometheus }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: prometheus }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.prometheus.svc:8080]
            labels: { cluster: dev }
      # Flux controllers (port http-prom) and the Flux Operator (port http-metrics) in flux-system.
      # No namespace target label: the controllers' own `namespace` label is the object's namespace.
      - job_name: flux
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [flux-system] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http-prom|http-metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: cluster
            replacement: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: prometheus
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.16.0
          args: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=2d']
          ports: [{ containerPort: 9090, name: http }]
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes: [{ name: config, configMap: { name: prometheus-config } }]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: prometheus
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: http }]
