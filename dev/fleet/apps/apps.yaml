apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: apps
spec:
  interval: 1m
  chart:
    spec:
      chart: podinfo
      version: '6.7.1'
      sourceRef: { kind: HelmRepository, name: podinfo, namespace: flux-system }
  values:
    replicaCount: 2
    resources: { requests: { cpu: 5m, memory: 16Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          resources: { requests: { cpu: 5m, memory: 16Mi } }
